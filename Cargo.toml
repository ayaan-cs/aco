[package]
name = "aco"
version = "0.1.0"
edition = "2021"
description = "Autonomous Code Optimizer: searches for faster Python by measuring real sandboxed runs"
license = "MIT"
repository = "https://github.com/ayaan-cs/aco"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
