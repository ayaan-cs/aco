[package]
name = "aco"
version = "0.1.0"
edition = "2021"
# ratatui 0.30 needs 1.88; CI builds and tests with exactly this version.
rust-version = "1.88"
description = "Autonomous Code Optimizer: searches for faster Python by measuring real sandboxed runs"
license = "MIT"
repository = "https://github.com/ayaan-cs/aco"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
